version: "3"

silent: true

tasks:
  docs:
    cmd: open https://taskfile.dev/usage/

  gnotes:
    desc: Create this week's gnotes and open the previous and current notes in rex
    vars:
      HOME_DIR: '{{.HOME_DIR | default .HOME}}'
    preconditions:
      - sh: test -d "{{.HOME_DIR}}/notes"
        msg: "{{.HOME_DIR}}/notes does not exist"
      - sh: command -v gnotes >/dev/null && command -v jq >/dev/null && command -v rex >/dev/null && command -v vim >/dev/null
        msg: "gnotes, jq, rex, and vim are required"
      - sh: '! rex session inspect gnotes >/dev/null 2>&1'
        msg: "rex session 'gnotes' already exists"
    cmds:
      - |
        cd "{{.HOME_DIR}}/notes"
        output="$(gnotes --output)"
        previous_title="$(printf '%s' "$output" | jq -er '.previous.title')"
        current_title="$(printf '%s' "$output" | jq -er '.current.title')"
        previous_file="$(printf '%s' "$output" | jq -er '.previous.file')"
        current_file="$(printf '%s' "$output" | jq -er '.current.file')"

        session=gnotes
        rex new "$session" --window "$previous_title" --cwd "{{.HOME_DIR}}/notes" -- vim "$previous_file"
        rex window new --session "$session" --focus=false --cwd "{{.HOME_DIR}}/notes" "$current_title" -- vim "$current_file"
        echo "Created rex session $session"

  checkout-pr:
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - git fetch source refs/pull-requests/{{ .CLI_ARGS }}/from:pr-{{ .CLI_ARGS }}
      - git checkout pr-{{ .CLI_ARGS }}

  list-worktree:
    silent: true
    desc: Interactively select and print the path of a git worktree (fuzzy)
    aliases: ["lwt"]
    dir: "{{ .USER_WORKING_DIR }}"
    preconditions:
      - sh: command -v fzf >/dev/null 2>&1
        msg: "fzf is required. Install with: brew install fzf"
    cmds:
      - |
        data=$(git -C {{ .USER_WORKING_DIR }} worktree list --porcelain | awk '/^worktree /{path=$2} /^branch /{branch=$2; sub(/refs\/heads\//, "", branch); print branch "\t" path}')
        count=$(echo "$data" | wc -l | tr -d ' ')
        if [ "$count" -lt 2 ]; then
          echo "No additional worktrees found." >&2
          exit 1
        fi
        selected=$(echo "$data" | tail -n +2 | cut -f1 | fzf --prompt="Worktree> " --height=40% --reverse)
        if [ -z "$selected" ]; then
          exit 1
        fi
        echo "$data" | awk -F'\t' -v branch="$selected" '$1 == branch {print $2}'

  delete-worktree:
    desc: Interactively select and delete a git worktree and its branch (fuzzy)
    aliases: ["dwt"]
    dir: "{{ .USER_WORKING_DIR }}"
    preconditions:
      - sh: command -v fzf >/dev/null 2>&1
        msg: "fzf is required. Install with: brew install fzf"
    cmds:
      - |
        data=$(git -C "{{ .USER_WORKING_DIR }}" worktree list --porcelain | awk 'BEGIN { first=1 } /^worktree /{path=$0; sub(/^worktree /, "", path)} /^branch /{branch=$2; sub(/refs\/heads\//, "", branch); if (first) { first=0; next } print branch "\t" path}')
        if [ -z "$data" ]; then
          echo "No additional worktrees found." >&2
          exit 1
        fi

        selected=$(echo "$data" | fzf --prompt="Delete worktree> " --height=40% --reverse)
        if [ -z "$selected" ]; then
          exit 1
        fi

        branch=$(echo "$selected" | awk -F'\t' '{print $1}')
        path=$(echo "$selected" | awk -F'\t' '{print $2}')

        printf 'Delete worktree %s and branch %s? [y/N] ' "$path" "$branch" >&2
        read answer
        case "$answer" in
          [yY]|[yY][eE][sS]) ;;
          *) echo "Aborted."; exit 1 ;;
        esac

        git -C "{{ .USER_WORKING_DIR }}" worktree remove "$path"
        git -C "{{ .USER_WORKING_DIR }}" branch -D "$branch"
        echo "Removed worktree $path and branch $branch"

  rex-dev:
    desc: Create a Rex session in the current repo
    aliases: ["rdev"]
    dir: "{{ default .USER_WORKING_DIR .DIR }}"
    vars:
      TARGET_DIR: "{{ default .USER_WORKING_DIR .DIR }}"
      REPO_NAME:
        sh: basename "$(git -C "{{ .TARGET_DIR }}" rev-parse --show-toplevel 2>/dev/null)"
      BRANCH_SLUG:
        sh: git -C "{{ .TARGET_DIR }}" branch --show-current 2>/dev/null | sed 's|^[^/]*/||'
    preconditions:
      - sh: command -v rex >/dev/null 2>&1
        msg: rex must be installed and available in PATH
      - sh: git -C "{{ .TARGET_DIR }}" rev-parse --is-inside-work-tree >/dev/null 2>&1
        msg: "DIR must be inside a git repo (DIR defaults to current directory)"
    cmds:
      - |
        {{if .CLI_ARGS_LIST}}
        rex new "dev-{{ .REPO_NAME }}-{{ .BRANCH_SLUG }}" --window dev --cwd "{{ .TARGET_DIR }}" --shell none -- fish -c '$argv; exec fish' {{range .CLI_ARGS_LIST}}{{. | shellQuote}} {{end}}
        {{else}}
        rex new "dev-{{ .REPO_NAME }}-{{ .BRANCH_SLUG }}" --window dev --cwd "{{ .TARGET_DIR }}"
        {{end}}
      - echo "Created Rex session dev-{{ .REPO_NAME }}-{{ .BRANCH_SLUG }}"

  tinygo-zed:
    desc: Configure Zed's gopls to use TinyGo's merged GOROOT
    dir: "{{.USER_WORKING_DIR}}"
    vars:
      TINYGO_TARGET: pico-w
      ZED_SETTINGS: .zed/settings.json
      TIMESTAMP:
        sh: date +%s
      GOROOT:
        sh: |
          tinygo info -target={{.TINYGO_TARGET}} | sed -n 's/^cached GOROOT: *//p'
      GOOS:
        sh: |
          tinygo info -target={{.TINYGO_TARGET}} | sed -n 's/^GOOS: *//p'
      GOARCH:
        sh: |
          tinygo info -target={{.TINYGO_TARGET}} | sed -n 's/^GOARCH: *//p'
      TAGS:
        sh: |
          tinygo info -target={{.TINYGO_TARGET}} | sed -n 's/^build tags: *//p' | tr ' ' ','
    cmds:
      - mkdir -p .zed
      - test -f {{.ZED_SETTINGS}} || echo '{}' > {{.ZED_SETTINGS}}
      - |
        cp {{.ZED_SETTINGS}} $(dirname {{.ZED_SETTINGS}})/{{.TIMESTAMP}}-$(basename {{.ZED_SETTINGS}}).bak
      - |
        jq --arg goroot "{{.GOROOT}}" \
           --arg goos "{{.GOOS}}" \
           --arg goarch "{{.GOARCH}}" \
           --arg tags "-tags={{.TAGS}}" \
           '.lsp.gopls.binary.env.GOROOT = $goroot
            | .lsp.gopls.binary.env.GOOS = $goos
            | .lsp.gopls.binary.env.GOARCH = $goarch
            | .lsp.gopls.binary.env.GOFLAGS = $tags
            | .lsp.gopls.initialization_options.buildFlags = [$tags]
            | .lsp.gopls.initialization_options.env.GOROOT = $goroot
            | .lsp.gopls.initialization_options.env.GOOS = $goos
            | .lsp.gopls.initialization_options.env.GOARCH = $goarch' \
           {{.ZED_SETTINGS}} > {{.ZED_SETTINGS}}.tmp
      - mv {{.ZED_SETTINGS}}.tmp {{.ZED_SETTINGS}}
      - echo "✓ {{.ZED_SETTINGS}} updated with GOROOT={{.GOROOT}}"
